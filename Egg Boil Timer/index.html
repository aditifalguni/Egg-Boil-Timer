<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egg Boil Timer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Egg Boil Timer</h1>
        <p>Perfectly boiled eggs every time! Choose your desired level of doneness.</p>
    </header>

    <!-- Timer Settings -->
    <section class="timer-settings">
        <button class="timer-btn" id="soft">Soft Boiled</button>
        <button class="timer-btn" id="medium">Medium Boiled</button>
        <button class="timer-btn" id="hard">Hard Boiled</button>
    </section>

    <!-- Timer Display -->
    <section class="timer-display">
        <h2 id="timer-text">Select Egg Type</h2>
        <p id="countdown"></p>
        <button id="start-timer" disabled>Start Timer</button>
    </section>

    <!-- Footer -->
    <footer>
        <p>Egg Boil Timer © 2025</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
